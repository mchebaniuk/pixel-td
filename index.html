<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стражи Рубежа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap">
<style>
  /* Интерфейс в духе концепта: тёмные панели в деревянной раме, золотые заголовки. Игра всегда в одной тёмной теме. */
  :root {
    --bg: #0e1016;
    --panel: #1c2130;
    --panel-hi: #2b3247;
    --wood: #6b4528;
    --wood-dk: #2a170a;
    --ink: #efe6cf;
    --muted: #a59d8c;
    --gold: #f3c843;
    --mana: #4a8fe8;
    --ok: #6ee05a;
    --font: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    --pixel: 'Press Start 2P', 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px; box-sizing: border-box; margin: 0;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .frame {
    background: var(--panel); border: 3px solid var(--wood);
    box-shadow: 0 0 0 2px var(--wood-dk), inset 0 0 0 2px var(--wood-dk), inset 0 3px 0 2px var(--panel-hi);
    border-radius: 4px;
  }

  /* верхняя панель */
  #top { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  body.wrap #top { flex-wrap: wrap; }
  #top button { height: 34px; }
  #top button, #top .pill { white-space: nowrap; flex: none; }
  .pill { display: flex; align-items: center; gap: 7px; height: 34px; box-sizing: border-box; padding: 0 12px; font-family: var(--pixel); font-size: 13px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #232a3e, #181d2b); }
  .pill canvas { width: 18px; height: 18px; image-rendering: pixelated; }
  .pill.gold { color: var(--gold); }
  .pill.life { color: #ff8a7a; }
  #wave { font-family: var(--font); font-size: 15px; }
  #wave b { color: var(--gold); font-family: var(--pixel); font-size: 12px; font-weight: 400; }
  /* анонс следующей волны — в стиле карточек нижней панели */
  #nextwave { font-family: var(--font); gap: 8px; padding: 0 10px 0 4px; }
  #nextwave .nw-pic { width: 26px; height: 26px; flex: none; display: grid; place-items: end center; overflow: hidden; border-radius: 3px;
    background: radial-gradient(ellipse at 50% 70%, #3a4668 0%, #161b29 75%); border: 2px solid #0e1119; box-shadow: inset 0 0 0 1px #4d5777; }
  #nextwave .nw-pic img { height: 24px; max-width: 24px; object-fit: contain; image-rendering: pixelated; }
  #nextwave .nw-text { display: flex; flex-direction: column; line-height: 1.05; }
  #nextwave .nw-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #nextwave .nw-name { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  #nextwave .nw-count { font-family: var(--pixel); font-size: 9px; color: var(--gold); }
  .nw-tag { font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 10px; white-space: nowrap;
    background: #1a2030; color: var(--ink); box-shadow: inset 0 0 0 1px #3b4563; cursor: help; }
  .nw-tag.air { color: #9fd0ff; box-shadow: inset 0 0 0 1px #2e5a8a; background: #15233a; }
  .nw-tag.armor { color: #d6dbe6; box-shadow: inset 0 0 0 1px #5a6378; background: #222836; }
  .nw-tag.fast { color: #ffd68a; box-shadow: inset 0 0 0 1px #6a5422; background: #2a2414; }
  .nw-tag.regen { color: #a8f07a; box-shadow: inset 0 0 0 1px #3a6a2a; background: #16261a; }
  .nw-tag.boss { color: #ffb0a0; box-shadow: inset 0 0 0 1px #8a2a22; background: #2e1412; }
  #nextwave .nw-time { font-family: var(--pixel); font-size: 10px; color: #1a1206; background: var(--gold); padding: 4px 6px; border-radius: 3px; box-shadow: inset 0 -2px 0 #9a6b1c; }
  #nextwave .nw-wait { font-size: 11px; font-weight: 500; color: var(--muted); }
  .unit, .spell { position: relative; }
  /* звёзды на финальном экране */
  .stars { display: flex; gap: 14px; font-size: clamp(48px, 7vw, 72px); line-height: 1; margin: 4px 0; }
  .stars span { color: #2e3348; text-shadow: 0 4px 0 #11141e, 3px 3px 0 #0a0c12; }
  .stars span.on { color: #ffd65a; text-shadow: 0 4px 0 #6a3e0c, 3px 3px 0 #2a170a, 0 0 18px rgba(255,214,90,0.55); }
  .spacer { flex: 1; }

  button {
    font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer;
    background: #2f3550; border: 2px solid var(--wood-dk); border-radius: 3px;
    box-shadow: inset 0 2px 0 #4a5276, inset 0 -2px 0 #1b1f30;
    padding: 4px 10px; min-height: 32px;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: #8a5a14; box-shadow: inset 0 2px 0 #c08a2a, inset 0 -2px 0 #5a3a0c; color: #fff4d6; }
  button.blue { background: #2456a8; box-shadow: inset 0 2px 0 #4a8fe8, inset 0 -2px 0 #163a74; }
  button.red { background: #8e2a22; box-shadow: inset 0 2px 0 #c0473b, inset 0 -2px 0 #5a1610; }
  button.on { outline: 2px solid var(--gold); outline-offset: -2px; }

  #stage { position: relative; align-self: center; line-height: 0; }
  #cv { display: block; cursor: pointer; touch-action: manipulation; border-radius: 2px; }

  /* ---------- нижние панели ---------- */
  #bottom { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 10px; }
  .panel { padding: 16px 10px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative;
    background: linear-gradient(180deg, #232a3e 0%, #181d2b 100%); }
  /* заголовок — золотая надпись на деревянной плашке поверх рамки */
  .panel h2 { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap;
    padding: 3px 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold);
    background: linear-gradient(180deg, #7a5230, #4e3119); border: 2px solid var(--wood-dk); border-radius: 3px;
    box-shadow: inset 0 1px 0 #a3754a, 0 2px 0 rgba(0,0,0,0.4); text-shadow: 1px 1px 0 #2a170a; }

  /* карточки защитников */
  .slots { display: flex; gap: 8px; justify-content: center; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 6px 5px; width: 100px; min-height: 0;
    background: linear-gradient(180deg, #2f3852, #1f2536); border: 2px solid #3b4563; border-radius: 4px;
    box-shadow: inset 0 1px 0 #4a5679, 0 2px 0 rgba(0,0,0,0.35); transition: transform 0.12s, border-color 0.12s, filter 0.12s; }
  .unit:hover:not(:disabled) { transform: translateY(-2px); border-color: #c9a24a; filter: none; }
  .unit .pic { width: 66px; height: 62px; display: grid; place-items: end center; overflow: hidden; border-radius: 3px;
    background: radial-gradient(ellipse at 50% 70%, #3a4668 0%, #161b29 75%); border: 2px solid #0e1119;
    box-shadow: inset 0 0 0 1px #4d5777, inset 0 -8px 12px rgba(0,0,0,0.5); }
  .unit img { height: 56px; max-width: 64px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)); }
  .unit .name { font-size: 14px; font-weight: 700; line-height: 1.1; }
  .unit .air { font-size: 10px; font-weight: 500; line-height: 1; padding: 2px 6px; white-space: nowrap; border-radius: 9px; background: #1a2030; color: var(--muted); }
  .unit .air.yes { color: #9fd0ff; background: #1b2a44; }
  .cost { display: inline-flex; align-items: center; gap: 4px; font-family: var(--pixel); font-size: 10px; color: var(--gold); }
  .cost canvas { width: 12px; height: 12px; image-rendering: pixelated; }
  .unit.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(243,200,67,0.35), inset 0 1px 0 #6a5a2a; background: linear-gradient(180deg, #4a3d1c, #2a2412); }
  .unit:disabled { opacity: 1; filter: grayscale(0.75) brightness(0.75); }
  .unit:disabled .cost { color: #ff7a6a; }
  .key { position: absolute; top: 3px; left: 3px; min-width: 14px; height: 14px; display: grid; place-items: center; z-index: 1;
    font-family: var(--pixel); font-size: 7px; color: #ffe7a0; background: rgba(10,12,20,0.85); border: 1px solid #5a4a22; border-radius: 2px; }

  /* выбранная башня */
  #info { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 76px; font-size: 13px; color: var(--muted); line-height: 1.35; }
  #info.empty { justify-content: center; text-align: center; padding: 0 6px; }
  #info b { color: var(--gold); }
  #info i { color: var(--ok); font-style: normal; }
  #info .tpic { flex: none; width: 60px; height: 60px; display: grid; place-items: end center; overflow: hidden; border-radius: 3px;
    background: radial-gradient(ellipse at 50% 70%, #3a4668 0%, #161b29 75%); border: 2px solid #0e1119; box-shadow: inset 0 0 0 1px #4d5777; }
  #info .tpic img { height: 54px; max-width: 58px; object-fit: contain; image-rendering: pixelated; }
  #info .tname { font-size: 15px; font-weight: 700; color: var(--ink); }
  #info .lvl { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
  #info .lvl .off { color: #3e455e; }
  #info .stats { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink); font-variant-numeric: tabular-nums; }
  #info .stats span { white-space: nowrap; }
  #info .stats em { font-style: normal; color: var(--muted); }
  #info .perk { color: #ffe08a; font-size: 12px; }
  #info .perk.next { color: var(--muted); }
  #info .stun { color: #ff8a7a; font-weight: 700; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; font-size: 14px; min-height: 36px; }

  /* заклинания: плитка заполняется по мере накопления маны, готовая — светится */
  .spells { display: flex; gap: 8px; justify-content: center; }
  .spell { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; width: 76px; height: 82px; padding: 4px 4px 5px;
    overflow: hidden; background: #141a28; border: 2px solid #3b4563; border-radius: 4px; box-shadow: inset 0 1px 0 #4a5679; }
  .spell::before { content: ''; position: absolute; inset: auto 0 0 0; height: calc(var(--charge, 0) * 100%);
    background: linear-gradient(0deg, rgba(74,143,232,0.45), rgba(74,143,232,0.12)); transition: height 0.2s; }
  .spell > *:not(.key) { position: relative; }
  .spell canvas { width: 36px; height: 36px; image-rendering: pixelated; margin-bottom: 2px; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)); }
  .spell span:not(.key) { font-size: 13px; font-weight: 700; }
  .spell small { display: inline-flex; align-items: center; gap: 3px; color: #9fd0ff; font-family: var(--pixel); font-size: 8px; }
  .spell small::before { content: ''; width: 6px; height: 6px; background: #4a8fe8; transform: rotate(45deg); box-shadow: inset 1px 1px 0 #b9dcff; }
  .spell.ready { border-color: #6aa8ff; box-shadow: 0 0 0 2px rgba(74,143,232,0.3), inset 0 1px 0 #6a86c9; }
  .spell:disabled { opacity: 1; }
  .spell:disabled canvas, .spell:disabled span:not(.key) { opacity: 0.55; }
  .spell.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(243,200,67,0.4); }
  #mana { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #9fd0ff; font-variant-numeric: tabular-nums; }
  #mana .track { flex: 1; height: 12px; background: #0c1424; border: 2px solid #0a0d16; border-radius: 6px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px #3b4563; }
  #mana .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #7fb6ff, #3a78d6); box-shadow: inset 0 2px 0 rgba(255,255,255,0.35); transition: width 0.2s; }
  #manaNum { min-width: 26px; text-align: right; font-family: var(--pixel); font-size: 10px; }

  /* баннер волны: карточка с портретом врага, подписью «Волна N из 6», крупным именем и особенностями */
  #banner {
    --acc: #ffd65a; --acc-dk: #6a3e0c; --edge: #b8862a;
    position: absolute; left: 50%; top: 9%; transform: translateX(-50%); z-index: 4; pointer-events: none;
    display: flex; align-items: center; gap: 16px; padding: 12px 26px 12px 12px; box-sizing: border-box; max-width: calc(100% - 24px);
    background: linear-gradient(180deg, rgba(36,30,22,0.97), rgba(16,13,10,0.97));
    border: 3px solid var(--edge); border-radius: 4px; white-space: nowrap; line-height: 1.2;
    box-shadow: 0 0 0 2px var(--wood-dk), inset 0 0 0 2px #4e3119, inset 0 2px 0 3px rgba(255,220,130,0.1), 0 10px 28px rgba(0,0,0,0.6);
    animation: bannerIn 3.2s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  #banner.boss, #banner.rage { --acc: #ff7a5a; --acc-dk: #5a1610; --edge: #c0473b; }
  #banner.ok { --acc: #a8f07a; --acc-dk: #1f5a14; --edge: #5aa84a; }
  #banner.ok { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 18px 14px; }
  /* портрет врага — как в нижней панели, только крупнее */
  .bn-pic { flex: none; width: 80px; height: 80px; display: grid; place-items: end center; overflow: hidden; border-radius: 3px;
    background: radial-gradient(ellipse at 50% 72%, #46557e 0%, #1a2033 72%); border: 2px solid #0e1119;
    box-shadow: 0 0 0 2px var(--edge), inset 0 0 0 1px #5a6688, inset 0 -10px 14px rgba(0,0,0,0.45); }
  .bn-pic img { height: 74px; max-width: 76px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.7)); }
  .bn-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .bn-lbl { font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--acc); opacity: 0.85;
    text-shadow: 1px 1px 0 #000; }
  .bn-title { font-family: var(--pixel); font-size: clamp(17px, 2.2vw, 28px); letter-spacing: 0.03em; color: var(--acc);
    text-shadow: 0 3px 0 var(--acc-dk), 2px 0 0 #120c06, -2px 0 0 #120c06, 0 2px 0 #120c06, 0 -2px 0 #120c06; }
  #banner.ok .bn-title { text-align: center; }
  .bn-sub { display: flex; align-items: center; gap: 8px; font-family: var(--font); font-size: 17px; font-weight: 600; color: #f6eedb; text-shadow: 1px 1px 0 #000; }
  .bn-sub .num { font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .bn-sub .nw-tag { font-size: 12px; text-shadow: none; }
  /* «волна отбита»: ниже заголовка — кто идёт дальше, с крупным портретом */
  .bn-next { display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: 3px; background: rgba(0,0,0,0.32); box-shadow: inset 0 0 0 1px rgba(168,240,122,0.18); }
  .bn-next .bn-pic { --edge: #8a6a2a; }
  .bn-next .bn-name { font-family: var(--font); font-size: 22px; font-weight: 700; color: #fff3c8; text-shadow: 1px 1px 0 #000; }
  .bn-next .nw-count { font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .bn-next .bn-lbl { color: var(--muted); opacity: 1; letter-spacing: 0.12em; font-size: 12px; }
  .bn-time { margin-left: auto; align-self: center; font-family: var(--pixel); font-size: 13px; color: #1a1206; background: var(--gold); padding: 6px 8px; border-radius: 3px;
    text-shadow: none; box-shadow: inset 0 -3px 0 #9a6b1c; }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%, -14px) scale(0.7); }
    10% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
    16%, 78% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -6px) scale(0.98); }
  }

  /* экраны старта и финала */
  #overlay { position: fixed; inset: 0; z-index: 6; line-height: 1.35; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(8,9,14,0.6); }
  .card { padding: 16px 20px; max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; box-sizing: border-box; }
  .card h1 { margin: 0; font-family: var(--pixel); line-height: 1.3; font-size: clamp(20px, 3vw, 30px); text-align: center; color: #ffd65a; text-wrap: balance;
    text-shadow: 0 4px 0 #6a3e0c, 2px 2px 0 #2a170a, -2px -2px 0 #2a170a, 2px -2px 0 #2a170a, -2px 2px 0 #2a170a; }
  .card h1.lose { color: #ff7a5a; text-shadow: 0 4px 0 #5a1610, 2px 2px 0 #1a0806, -2px -2px 0 #1a0806, 2px -2px 0 #1a0806, -2px 2px 0 #1a0806; }
  .card .lead { text-align: center; }
  .card .roster, .card .stars { justify-content: center; }
  .card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .card .lead { margin: 0; color: var(--muted); font-size: 14px; }
  .card .roster { display: flex; gap: 12px; align-items: flex-end; }
  .card .roster img { height: 48px; image-rendering: pixelated; }
  .card > button { position: sticky; bottom: 0; box-shadow: inset 0 2px 0 #c08a2a, inset 0 -2px 0 #5a3a0c, 0 -6px 12px 6px var(--panel); }
  .card button { align-self: center; font-size: 20px; padding: 8px 34px; min-height: 44px; letter-spacing: 0.03em; }

  /* верхняя панель ужимается ступенями, пока не влезет в одну строку (fitTop в ui.js) */
  body.compact #top { gap: 6px; }
  body.compact .pill { padding: 0 8px; font-size: 12px; }
  body.compact #nextwave .nw-tag, body.compact #nextwave .nw-lbl { display: none; }
  body.compact #wave .wv-name { display: none; }
  body.tight #top { gap: 4px; }
  body.tight .pill { padding: 0 6px; gap: 5px; font-size: 11px; }
  body.tight #top button { padding: 4px 8px; }
  body.tight #wave .wv-lbl, body.tight #nextwave .nw-text, body.tight #nextwave .nw-wait { display: none; }
  body.tight #next:disabled { display: none; }
  #sound.muted { text-decoration: line-through; }
  @media (max-width: 1150px) {
    .slots, .spells { gap: 6px; }
    .unit { flex: 1 1 0; min-width: 0; width: auto; max-width: 100px; }
    .unit .air { font-size: 9px; padding: 2px 4px; }
    .spell { flex: 1 1 0; min-width: 0; width: auto; max-width: 76px; }
    .spell span:not(.key) { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  }
  @media (max-width: 760px) {
    #bottom { grid-template-columns: 1fr 1fr; row-gap: 18px; }
    .unit { width: 84px; } .unit .pic { width: 56px; height: 52px; } .unit img { height: 46px; }
    .spell { width: 64px; }
    #bottom .build { grid-column: 1 / -1; }
    #nextwave .nw-tag:not(.boss):not(.air) { display: none; }
  }
  /* низкий горизонтальный экран (телефон): панели колонкой справа от поля, поле крупнее */
  @media (orientation: landscape) and (max-height: 540px) {
    body { padding-block: 6px; }
    #app { --side: clamp(200px, 28vw, 250px); display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr);
      gap: 6px 8px; height: 100%; max-width: none !important; }
    #top { grid-column: 1 / -1; }
    #top button, .pill { height: 30px; min-height: 30px; }
    #stage { align-self: start; justify-self: center; }
    #bottom { display: flex; flex-direction: column; gap: 5px; margin-top: 0; min-height: 0; overflow-y: auto; }
    .panel { padding: 5px 6px; gap: 5px; }
    .panel h2, .key { display: none; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .unit { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 6px; row-gap: 2px; align-items: center; justify-items: start;
      width: auto; max-width: none; padding: 3px 5px; }
    .unit .pic { grid-row: 1 / 3; width: 30px; height: 30px; }
